version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    time: "07:00"
  open-pull-requests-limit: 10
  versioning-strategy: lockfile-only
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
      exclude-patterns:
        - "rubocop*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    time: "07:00"
  open-pull-requests-limit: 10
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
